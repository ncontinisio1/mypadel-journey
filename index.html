<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Forge · Scheda Nicki v8</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Forge">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b0d12;--panel:#131722;--panel2:#191e2b;--line:#262d3d;--text:#f4f6fb;--muted:#8f99ad;--accent:#9dff57;--blue:#66d9ff;--amber:#ffc45e;--danger:#ff5f6d;--shadow:0 18px 44px #0007}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}
body{margin:0;background:radial-gradient(800px 450px at 50% -120px,#26365d55,transparent),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
.app{max-width:760px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 15px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.eyebrow{font-size:10.5px;letter-spacing:.18em;color:var(--accent);font-weight:800}
.top h1{margin:4px 0 2px;font-size:25px;letter-spacing:-.04em;line-height:1.1}
.top .sub{color:var(--muted);font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;font-size:18px;flex:none}
.summary{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-bottom:16px}
.metric{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:12px;border-radius:16px;text-align:left;color:var(--text)}
.metric b{display:block;font-size:18px;line-height:1.2}
.metric span{display:block;color:var(--muted);font-size:10.5px;margin-top:4px}
.metric.run{border-color:var(--accent)}.metric.run span{color:var(--accent);font-weight:700}
.striplabel{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:800;margin:2px 2px 7px}
.strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:52px;padding:9px 11px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:800;font-size:13px;position:relative}
.chip small{display:block;font-size:9px;font-weight:700;color:var(--muted);margin-top:2px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#10150d}.chip.active small{color:#1b2a0d}
.chip.tag-scarico{border-color:#3a4766}.chip.tag-test{border-color:var(--amber)}
.chip .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.chip.active .dot{background:#10150d}
.daychip{min-width:120px;text-align:left}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 2px 12px}
.sectionhead h2{margin:0;font-size:19px}.sectionhead small{color:var(--muted);font-size:12px;white-space:nowrap}
.exercise{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:21px;margin-bottom:12px;overflow:hidden}
.exercise.complete{border-color:#9dff5755}
.exhead{padding:15px 15px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead h3{margin:0 0 6px;font-size:16.5px;line-height:1.25}
.presc{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:800;padding:4px 8px;border-radius:9px;background:#222a3b;color:var(--muted);border:0}
.tag.load{background:#9dff571f;color:var(--accent)}.tag.test{background:#ffc45e22;color:var(--amber)}
.tag.up{background:#66d9ff1f;color:var(--blue)}
.exdone{font-size:12px;font-weight:800;color:var(--accent);flex:none;padding-top:3px}
.note{margin:0 15px 13px;padding:10px 12px;border-left:2px solid var(--blue);background:#66d9ff10;border-radius:0 10px 10px 0;color:#cfe6f2;font-size:12px;line-height:1.5}
.notebtn{background:none;border:0;color:var(--blue);font-size:11.5px;font-weight:800;padding:0 15px 12px}
.sets{border-top:1px solid var(--line);padding:6px 8px 9px}
.sethead,.setrow{display:grid;grid-template-columns:24px 1.2fr 1fr .78fr 40px;gap:6px;align-items:center;padding:4px 3px}
.sethead{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding-top:6px}
.sethead span:last-child{text-align:center}
.setno{display:grid;place-items:center;height:26px;border-radius:8px;background:#222837;color:var(--muted);font-size:11px;font-weight:800}
.field{background:#0f121a;border:1px solid var(--line);border-radius:12px;padding:7px 8px;display:flex;align-items:center;gap:4px;min-width:0}
.field input{min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--text);font-weight:750;font-size:15px;padding:0}
.field input::placeholder{color:#4b5468}
.plate{border:0;background:#222a3b;color:var(--muted);font-size:10px;font-weight:800;border-radius:7px;padding:3px 5px;flex:none}
.done{appearance:none;width:38px;height:38px;border:1px solid #394154;border-radius:12px;background:#11151e;display:grid;place-items:center;cursor:pointer;margin:0}
.done:after{content:'✓';color:transparent;font-weight:900;font-size:19px}
.done:checked{background:var(--accent);border-color:var(--accent)}.done:checked:after{color:#0c1308}
.setrow:has(.done:checked) .field{opacity:.5}
.hint{padding:0 15px 13px;color:var(--blue);font-size:11px;line-height:1.5}
.hint.up{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 20px;line-height:1.6}
.finish{width:100%;margin-top:6px;border:0;border-radius:16px;padding:15px;background:var(--accent);color:#10150d;font-weight:900;font-size:15px}
.finish.closed{background:#1d2433;color:var(--accent);border:1px solid #9dff5755}
.timerwrap{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:#05070bcc;backdrop-filter:blur(7px);padding:22px}
.timerwrap.show{display:flex}
.timercard{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:26px 22px;text-align:center;box-shadow:var(--shadow)}
.timercard .who{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted);text-transform:uppercase}
.timercard .next{font-size:12px;color:var(--blue);margin-top:10px;min-height:16px}
.count{font-size:62px;font-weight:900;letter-spacing:-.04em;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.count.go{color:var(--accent)}
.bar{height:7px;border-radius:99px;background:#232a3a;overflow:hidden;margin:14px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.timerbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.timerbtns button{border:0;border-radius:14px;padding:13px 6px;font-weight:900}
.btn-dark{background:#222a3b;color:var(--text)}.btn-light{background:var(--accent);color:#10150d}
.btn-stop{background:transparent;color:var(--danger);border:1px solid #ff5f6d55 !important;width:100%;margin-top:9px;border-radius:14px;padding:11px;font-weight:800}
.pill{position:fixed;z-index:55;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));display:none;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--accent);border-radius:99px;padding:8px 8px 8px 16px;box-shadow:var(--shadow);color:var(--text);min-width:230px;max-width:92vw}
.pill.show{display:flex}.pill b{font-size:20px;font-variant-numeric:tabular-nums;min-width:58px}.pill b.go{color:var(--accent)}
.pill span{flex:1;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill button{border:0;background:#222a3b;color:var(--text);border-radius:99px;padding:8px 11px;font-weight:900;font-size:12px}
.nav{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);padding:8px 18px calc(8px + env(safe-area-inset-bottom));background:#11151ef2;border-top:1px solid var(--line);backdrop-filter:blur(16px);display:flex;justify-content:space-around}
.nav button{border:0;background:none;color:var(--muted);display:grid;gap:3px;place-items:center;font-size:10.5px;font-weight:700;padding:4px 10px}
.nav button i{font-style:normal;font-size:19px}.nav button.active{color:var(--accent)}
.modal{position:fixed;z-index:70;inset:0;background:#05070bbb;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal.show{display:flex}
.sheet{width:min(760px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 17px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:21px}.sheet p.lead{margin:0 0 16px;color:var(--muted);font-size:12.5px;line-height:1.5}
.formlabel{display:block;color:var(--muted);font-size:11.5px;font-weight:700;margin:14px 0 6px}
.input{width:100%;background:#0e121a;border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--text);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.primary{width:100%;margin-top:16px;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#10150d;font-weight:900}
.secondary{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:14px;padding:13px;background:transparent;color:var(--text);font-weight:700}
.secondary.danger{color:var(--danger)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#0e121a;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:none;color:var(--muted);padding:9px;border-radius:10px;font-weight:800;font-size:13px}
.tabs button.on{background:var(--accent);color:#10150d}
.histitem{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;background:var(--panel2);color:var(--text)}
.histitem b{font-size:14px}.histitem div{color:var(--muted);font-size:12px;margin-top:4px}
.histitem .pr{color:var(--accent);font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpis div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px}
.kpis b{display:block;font-size:17px}.kpis span{font-size:10.5px;color:var(--muted)}
.chart{background:#0e121a;border:1px solid var(--line);border-radius:16px;padding:10px 6px 4px;margin-bottom:12px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);padding:0 8px 8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.plates{display:flex;flex-wrap:wrap;gap:7px;align-items:flex-end;justify-content:center;margin:18px 0 8px;min-height:90px}
.pl{border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#0b0d12;width:30px}
.barline{height:10px;width:100%;background:#3a4357;border-radius:5px;margin-bottom:10px}
.toast{position:fixed;z-index:90;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-110px);background:#f4f6fb;color:#111722;padding:12px 16px;border-radius:13px;box-shadow:var(--shadow);font-weight:700;font-size:13px;transition:.3s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.pr{background:var(--accent)}
.hidden{display:none !important}
.wu{margin:0 12px 12px;border:1px dashed #3a4357;border-radius:16px;padding:10px 10px 6px;background:#0f121a80}
.wu.closed{padding-bottom:10px}
.wuhead{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--text);padding:0 2px 4px;text-align:left}
.wuhead b{font-size:11px;letter-spacing:.14em;font-weight:900;color:var(--amber)}
.wuhead span{font-size:11px;color:var(--muted);font-weight:700}
.wurow{display:grid;grid-template-columns:30px 1fr auto 38px;gap:8px;align-items:center;padding:6px 2px;border-top:1px solid var(--line)}
.wurow .setno{background:#2a2416;color:var(--amber);font-size:10px}
.wukg{font-size:17px;font-weight:850;font-variant-numeric:tabular-nums}
.wukg small{font-size:11px;color:var(--muted);font-weight:700;margin-left:3px}
.wumeta{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.wudone:checked{background:var(--amber);border-color:var(--amber)}
.wurow:has(.wudone:checked) .wukg{opacity:.5}
.maxrow{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:6px 0}
.maxrow span{font-size:13px}.maxrow small{display:block;color:var(--muted);font-size:10.5px}
.input.sm{padding:9px 10px}
.clock{display:none;align-items:center;gap:8px;margin:-6px 2px 16px;font-size:12px;color:var(--muted)}
.clock.show{display:flex}.clock b{color:var(--text);font-variant-numeric:tabular-nums}
.clock i{font-style:normal;color:#3a4357}
.clock button{margin-left:auto;border:0;background:none;color:var(--blue);font-size:11.5px;font-weight:800;padding:0}
.timeedit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timeedit input{color-scheme:dark}
.banner{display:flex;gap:10px;align-items:center;border:1px solid #ffc45e55;background:#ffc45e12;border-radius:16px;padding:11px 12px;margin:-4px 0 14px;font-size:12px;line-height:1.45;color:#f3e2bf}
.banner b{color:var(--amber)}.banner button{flex:none;border:0;border-radius:10px;padding:8px 10px;font-weight:900;font-size:12px;background:var(--amber);color:#1a1405}
.banner .x{background:transparent;color:var(--muted);padding:6px}
.exercise.ss{border-left:3px solid var(--blue)}
.tag.ss{background:#66d9ff1f;color:var(--blue)}
.hint.warn{color:var(--amber)}
.field input.need{box-shadow:0 0 0 2px var(--danger);border-radius:6px}
.ftab{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 14px}
.ftab th{color:var(--muted);font-weight:800;font-size:10px;letter-spacing:.06em;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.ftab th:first-child,.ftab td:first-child{text-align:left}
.ftab td{padding:7px 4px;border-bottom:1px solid #1d2331;text-align:right;font-variant-numeric:tabular-nums}
.ftab .pos{color:var(--accent)}.ftab .neg{color:var(--amber)}.ftab .mut{color:#4b5468}
.tabs.t3{grid-template-columns:1fr 1fr 1fr}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <div class="eyebrow">FORGE TRACKER</div>
      <h1 id="hTitle">Nessuna scheda</h1>
      <div class="sub" id="hSub">Importa il tuo file Excel per iniziare</div>
    </div>
    <button class="iconbtn" id="btnReset" title="Azzera giorno">↻</button>
  </header>

  <div id="banners"></div>
  <section class="summary">
    <div class="metric"><b id="mProgress">0%</b><span>completamento</span></div>
    <div class="metric"><b id="mVolume">0</b><span>kg volume</span></div>
    <button class="metric" id="mDuration" type="button"><b id="dur">0:00</b><span id="durAction">Avvia durata</span></button>
  </section>

  <div class="clock" id="clock"><span>Inizio <b id="tStart">—</b></span><i>→</i><span>Fine <b id="tEnd">—</b></span><button id="btnTimes">Modifica</button></div>
  <div id="weekBox" class="hidden">
    <div class="striplabel">SETTIMANA</div>
    <div class="strip" id="weeks"></div>
  </div>
  <div id="dayBox" class="hidden">
    <div class="striplabel">GIORNO</div>
    <div class="strip" id="days"></div>
  </div>

  <div class="sectionhead"><h2 id="dayTitle"></h2><small id="setCount"></small></div>
  <section id="workout"></section>
</main>

<div class="timerwrap" id="timerWrap">
  <div class="timercard">
    <div class="who" id="timerWho">Recupero</div>
    <div class="count" id="count">00:00</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="timerbtns">
      <button class="btn-dark" id="btnMinus">−15 s</button>
      <button class="btn-dark" id="btnPlus">+30 s</button>
      <button class="btn-light" id="btnMin">Riduci</button>
    </div>
    <button class="btn-stop" id="btnSkip">Termina recupero</button>
    <div class="next" id="timerNext"></div>
  </div>
</div>
<div class="pill" id="pill"><b id="pillCount">0:00</b><span id="pillWho"></span><button id="pillPlus">+30</button><button id="pillOpen">⤢</button></div>

<nav class="nav">
  <button class="active"><i>◉</i>Allenamento</button>
  <button id="btnHistory"><i>◷</i>Storico</button>
  <button id="btnSettings"><i>⚙</i>Impostazioni</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='forgeGym_v3';
const DEFAULTS={settings:{defaultRest:90,bar:20,plates:'25,20,15,10,5,2.5',sound:true,bgAudio:true,autoNext:true,accStep:2.5,
    wu:true,wuRamp:'std',wuBase:'work',wuStep:5,wuRest:60},
  maxes:{},program:null,week:0,day:0,sessions:{},history:{},names:{},log:[],timer:null};
let data=load(),timerId=null,endAt=0,total=0,minimized=false,bgEl=null,bgUrl=null,durId=null,wakeLock=null,audio=null,lastBeep=-1;

function load(){
  let d;try{d=JSON.parse(localStorage.getItem(KEY))||{}}catch{d={}}
  const out=Object.assign(structuredClone(DEFAULTS),d);
  out.settings=Object.assign(structuredClone(DEFAULTS.settings),d.settings||{});
  return out;
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t,cls=''){const el=document.getElementById('toast');el.textContent=t;el.className='toast show '+cls;clearTimeout(toast._t);toast._t=setTimeout(()=>el.className='toast',2800)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtKg=n=>(Math.round(n*100)/100).toLocaleString('it-IT');
const fmtTime=t=>t?new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'—';
const toHM=t=>{if(!t)return'';const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function fromHM(hm,ref){if(!/^\d{1,2}:\d{2}$/.test(hm||''))return null;const [h,m]=hm.split(':').map(Number);const d=new Date(ref||Date.now());d.setHours(h,m,0,0);return d.getTime()}
function markStart(s){if(!s.startedAt)s.startedAt=Date.now()}
const fmtDur=n=>{n=Math.max(0,Math.round(n));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`};

/* ---------- parsing del workbook ---------- */
const norm=s=>String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const isDash=v=>['','—','–','-'].includes(String(v??'').trim());
function parseSR(v){const m=String(v??'').trim().match(/^(\d+)\s*[×xX]\s*(.+)$/);return m?{sets:Math.max(1,+m[1]),reps:m[2].trim()}:null}
function parseRest(v,fb){const s=String(v??'').toLowerCase().replace(',','.');const m=s.match(/([\d.]+)\s*(minut|min|m\b|second|sec|s\b)/);if(m){const n=parseFloat(m[1]);return Math.round(m[2][0]==='m'?n*60:n)}const n=parseFloat(s);return Number.isFinite(n)?Math.round(n):fb}
function num(v){const n=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(n)?n:null}
function firstRep(r){const m=String(r??'').match(/\d+/);return m?+m[0]:0}

function parseDays(rows){
  const days=[];let cur=null;
  for(const r of rows||[]){
    const a=String(r[0]??'').trim();
    if(/^giorno\b/i.test(a)){cur={exercises:[]};days.push(cur);continue}
    if(!cur||!a||norm(a)==='esercizio')continue;
    cur.exercises.push({name:a,rest:parseRest(r[4],data.settings.defaultRest),note:String(r[5]??'').trim()});
  }
  return days.filter(d=>d.exercises.length).map((d,i)=>({label:'Giorno '+String.fromCharCode(65+i),title:d.exercises[0].name,exercises:d.exercises}));
}
function parseMain(rows){
  const out={},head=rows?.[0]||[],cols={};
  for(let c=2;c<head.length;c++)if(head[c])cols[norm(head[c])]=c;
  (rows||[]).slice(1).forEach(r=>{const w=parseInt(r[0],10);if(!w)return;
    const sr=parseSR(r[1]),test=!sr&&/test/i.test(String(r[1]??''));
    const loads={};for(const k in cols)loads[k]=num(r[cols[k]]);
    out[w]={sr,test,loads};});
  return out;
}
function parseVariants(rows){
  const head=rows?.[0]||[],rep={},load={},out={};
  for(let c=1;c<head.length;c++){const k=norm(head[c]);if(!k)continue;if(rep[k]===undefined)rep[k]=c;else if(load[k]===undefined)load[k]=c}
  (rows||[]).slice(1).forEach(r=>{const w=parseInt(r[0],10);if(!w)return;const e={};
    for(const k in rep){const sr=parseSR(r[rep[k]]);e[k]=(isDash(r[rep[k]])||!sr)?null:{sets:sr.sets,reps:sr.reps,weight:num(r[load[k]])}}
    out[w]=e;});
  return out;
}
function parseAccessori(rows){
  const head=rows?.[0]||[],cols={},out={};
  for(let c=1;c<head.length;c++){const k=norm(head[c]);if(k&&cols[k]===undefined)cols[k]=c}
  (rows||[]).slice(1).forEach(r=>{const w=parseInt(r[0],10);if(!w)return;const e={};
    for(const k in cols){const sr=parseSR(r[cols[k]]);e[k]=(isDash(r[cols[k]])||!sr)?null:{sets:sr.sets,reps:sr.reps,weight:null}}
    out[w]=e;});
  return out;
}
/* superset "A + B" con reps "(x + y)" -> due esercizi collegati, recupero solo dopo B */
function splitSS(e){
  const parts=String(e.name).split(/\s+\+\s+/);
  if(parts.length!==2)return[e];
  const m=String(e.reps??'').match(/^\(\s*(.+?)\s*\+\s*(.+?)\s*\)$/),r=m?[m[1],m[2]]:[e.reps,e.reps];
  const gid=norm(e.name);
  return parts.map((n,i)=>({...e,name:n.trim(),reps:r[i],note:i?'':e.note,ss:{id:gid,pos:i,with:parts[1-i].trim()}}));
}
function splitProgram(p){p.weeks.forEach(w=>w.days.forEach(d=>{d.exercises=d.exercises.flatMap(splitSS)}));p.v=8;return p}
/* "W1–W4 | ... | RPE 7.5–8" dal foglio Panoramica -> limite alto del target */
function parseRpeTargets(rows){
  const out=[];
  (rows||[]).forEach(r=>{
    let wk=null,rpe=null;
    r.forEach(c=>{const t=String(c??'');
      const a=t.match(/^\s*W(\d+)\s*[–—-]\s*W(\d+)\s*$/i);if(a)wk=[+a[1],+a[2]];
      const b=t.match(/RPE\s*([\d.,]+)(?:\s*[–—-]\s*([\d.,]+))?/i);if(b)rpe=num(b[2]??b[1]);});
    if(wk&&rpe)out.push({from:wk[0],to:wk[1],max:rpe});
  });
  return out;
}
function buildProgram(sheets){
  const days=parseDays(sheets['foglio scheda']);
  if(!days.length)throw new Error('Foglio scheda non riconosciuto: manca una riga "Giorno X".');
  const main=parseMain(sheets['tabelle dei carichi']);
  const vari=parseVariants(sheets['varianti con fermo']);
  const acc=parseAccessori(sheets['accessori']);
  const nums=[...new Set([...Object.keys(main),...Object.keys(vari),...Object.keys(acc)].map(Number))].filter(Boolean).sort((a,b)=>a-b);
  if(!nums.length)throw new Error('Nessuna settimana trovata nei fogli dei carichi.');
  let prevLoad=null;
  const weeks=nums.map(w=>{
    const m=main[w],sum=m?Object.values(m.loads).reduce((a,b)=>a+(b||0),0):0;
    const tag=m?.test?'test':(prevLoad!==null&&sum>0&&sum<prevLoad?'scarico':'');
    if(sum>0)prevLoad=sum;
    return{week:w,tag,days:days.map(d=>({label:d.label,title:d.title,
      exercises:d.exercises.map(e=>resolve(e,w,main,vari,acc)).filter(Boolean)}))};
  });
  return splitProgram({weeks,dayLabels:days.map(d=>({label:d.label,title:d.title})),rpeTargets:parseRpeTargets(sheets['panoramica'])});
}
function resolve(ex,w,main,vari,acc){
  const k=norm(ex.name),base={name:ex.name,rest:ex.rest,note:ex.note};
  if(vari[w]&&k in vari[w]){const v=vari[w][k];return v?{...base,...v,src:'variante'}:null}
  if(main[w]&&k in (main[w].loads||{})){
    if(main[w].test)return{...base,sets:1,reps:'Test',weight:null,test:true,src:'test'};
    if(!main[w].sr)return null;
    return{...base,sets:main[w].sr.sets,reps:main[w].sr.reps,weight:main[w].loads[k],src:'fondamentale'};
  }
  if(acc[w]&&k in acc[w]){const a=acc[w][k];return a?{...base,...a,src:'accessorio'}:null}
  return{...base,sets:3,reps:'—',weight:null,src:'non mappato'};
}

/* ---------- sessioni & storico ---------- */
function cur(){return data.program?.weeks?.[data.week]}
function sKey(w=cur()?.week??0,d=data.day){return 'w'+w+'_d'+d}
function session(){const k=sKey();const s=data.sessions[k]||(data.sessions[k]={done:{},w:{},r:{},p:{},elapsed:0,since:null});
  s.p??={};s.wu??={};s.elapsed??=0;s.since??=null;return s}
function isBarbell(e){return ['fondamentale','variante','test'].includes(e.src)||(/bilanciere/i.test(e.name)&&!/manubri/i.test(e.name))}
function rpeTarget(weekNum){
  const w=data.program?.weeks?.find(x=>x.week===weekNum);if(!w||w.tag)return null; /* niente target in scarico/test */
  return data.program.rpeTargets?.find(t=>weekNum>=t.from&&weekNum<=t.to)?.max??null;
}
function rpeCheck(name,weekNum){
  const t=rpeTarget(weekNum);if(t==null)return null;
  const hs=hist(name).filter(h=>h.week===weekNum&&h.planned!=null&&h.rpe!=null&&h.rpe!=='');
  if(!hs.length)return null;
  const avg=hs.reduce((a,h)=>a+ +h.rpe,0)/hs.length;
  return{avg:Math.round(avg*10)/10,target:t,over:avg>t+1e-9,kg:Math.max(...hs.map(h=>h.weight||0)),n:hs.length};
}
function hist(name){return data.history[norm(name)]||[]}
function e1rm(w,r){r=firstRep(r);if(!w||!r||r>12)return 0;return r===1?w:w*(1+r/30)}
function bestE1(name){return hist(name).reduce((m,h)=>Math.max(m,e1rm(h.weight,h.reps)),0)}
function lastSession(name){
  const h=hist(name);if(!h.length)return null;
  const d=h[h.length-1].date,items=h.filter(x=>x.date===d);
  return{date:d,items,last:h[h.length-1]};
}
/* doppia progressione: range semplice "8-10" -> top 10 */
function rangeTop(reps){const m=String(reps).match(/^\s*(\d+)\s*-\s*(\d+)\s*$/);return m?+m[2]:null}
function progression(e){
  if(e.weight!=null||e.test)return null;
  const top=rangeTop(e.reps),ls=lastSession(e.name);
  if(!top||!ls||!ls.items.length)return null;
  const w=Math.max(...ls.items.map(x=>x.weight||0));
  const top_ok=ls.items.length>=e.sets&&ls.items.every(x=>firstRep(x.reps)>=top);
  return top_ok?{suggest:w+(+data.settings.accStep||2.5),from:w,top}:null;
}

/* ---------- riscaldamento (serie di avvicinamento) ----------
   - si applica al PRIMO esercizio del giorno con carico programmato
     (Back squat, Panca piana, Stacco o, nel giorno D, Panca a volume)
   - base "lavoro": percentuali del carico di lavoro del giorno
     base "massimale": percentuali dell'1RM (inserito o stimato), mai sopra il lavoro
   - arrotondamento ai multipli impostati (default 5 kg = 2,5 per lato)
   - non entra in volume, completamento, storico ed e1RM */
const WU_RAMPS={
  short:[[0.50,5],[0.75,3],[0.90,1]],
  std:  [[0.40,5],[0.60,4],[0.75,3],[0.88,2]],
  long: [[0.30,8],[0.50,5],[0.65,4],[0.78,3],[0.88,2],[0.95,1]]
};
const WU_LABEL={short:'Breve',std:'Standard',long:'Lunga'};
function maxOf(name){const v=data.maxes?.[norm(name)];return v>0?v:null}
function effMax(name){return maxOf(name)||Math.round(bestE1(name))||null}
function wuIndex(day){
  if(!data.settings.wu||!day)return -1;
  return day.exercises.findIndex(e=>(e.weight>0)||(e.test&&effMax(e.name)));
}
function wuSets(e){
  const st=data.settings,bar=+st.bar||20,step=Math.max(0.5,+st.wuStep||5);
  const work=e.test?effMax(e.name):e.weight;
  if(!work||work<=bar)return[];
  const m=st.wuBase==='max'?effMax(e.name):null;
  const ref=e.test?work:(m&&m>work?m:work);
  const rnd=v=>Math.round(v/step)*step;
  const out=[];
  if(work>=bar*1.8)out.push({kg:bar,reps:8,bar:true});
  (WU_RAMPS[st.wuRamp]||WU_RAMPS.std).forEach(([f,r])=>{
    const k=rnd(ref*f);
    if(k>bar&&k<work)out.push({kg:k,reps:r,pct:Math.round(k/work*100)});
  });
  /* scarta i gradini troppo vicini (< 10% del lavoro), partendo dall'alto:
     l'ultima serie di avvicinamento resta sempre la piu' pesante */
  const gap=Math.max(step,work*0.1),barSet=out.find(o=>o.bar),res=[];
  out.filter(o=>!o.bar).reverse().forEach(o=>{
    const last=res[res.length-1];
    if((!last||last.kg-o.kg>=gap-1e-9)&&(!barSet||o.kg-barSet.kg>=gap-1e-9))res.push(o)});
  if(barSet)res.push(barSet);
  return res.reverse();
}
function wuBlock(e,s){
  const sets=wuSets(e);if(!sets.length)return'';
  const n=sets.filter((_,i)=>s.wu[i]).length,all=n===sets.length,open=!all||s.wuOpen;
  return `<div class="wu ${open?'':'closed'}">
    <button class="wuhead" onclick="toggleWuOpen()"><b>RISCALDAMENTO</b><span>${WU_LABEL[data.settings.wuRamp]||''} · ${n}/${sets.length}${all?' ✓':''} ${open?'▴':'▾'}</span></button>
    ${open?sets.map((o,i)=>`<div class="wurow">
      <div class="setno">R${i+1}</div>
      <div class="wukg">${fmtKg(o.kg)}<small>kg × ${o.reps}</small></div>
      <div class="wumeta">${o.bar?'bilanciere':'~'+o.pct+'%'} ${o.bar?'':`<button class="plate" onclick="openPlates(${o.kg})">⊜</button>`}</div>
      <input class="done wudone" type="checkbox" data-wi="${i}" ${s.wu[i]?'checked':''} aria-label="Riscaldamento ${i+1}">
    </div>`).join(''):''}
  </div>`;
}
window.toggleWuOpen=()=>{const s=session();s.wuOpen=!s.wuOpen;save();render()};
function toggleWu(c,day){
  unlockAudio();
  const s=session(),i=+c.dataset.wi,ei=wuIndex(day),ex=day.exercises[ei],sets=wuSets(ex);
  s.wu[i]=c.checked;
  if(c.checked){
    if(!s.since&&!s.elapsed){s.since=Date.now();markStart(s);requestWake()}
    const nx=sets[i+1];
    const lbl=nx?`Prossima: ${fmtKg(nx.kg)} kg × ${nx.reps}`
      :`Prima serie di lavoro: ${ex.test?'test':fmtKg(ex.weight)+' kg × '+ex.reps}`;
    s.wuOpen=false;
    startTimer(+data.settings.wuRest||60,ex.name+' · riscaldamento',lbl);
  }
  save();render();
}

function wuLifts(){
  const p=data.program;if(!p)return[];const set=new Map();
  p.weeks.forEach(w=>w.days.forEach(d=>{const i=d.exercises.findIndex(e=>e.weight>0||e.test);if(i>=0)set.set(norm(d.exercises[i].name),d.exercises[i].name)}));
  return[...set.values()];
}

/* ---------- render ---------- */
function render(){
  paintBanners();
  const p=data.program;
  if(!p){document.getElementById('workout').innerHTML='<div class="empty">Nessuna scheda caricata.<br>Apri <b>Impostazioni → Importa scheda Excel</b> e seleziona il tuo file.</div>';return}
  data.week=Math.min(data.week,p.weeks.length-1);
  const week=p.weeks[data.week];
  data.day=Math.min(data.day,week.days.length-1);
  const day=week.days[data.day],s=session();

  document.getElementById('hTitle').textContent='Settimana '+week.week;
  document.getElementById('hSub').textContent=day.label+' · '+day.title+(week.tag?' · '+week.tag.toUpperCase():'');
  document.getElementById('weekBox').classList.remove('hidden');
  document.getElementById('dayBox').classList.remove('hidden');
  document.getElementById('weeks').innerHTML=p.weeks.map((w,i)=>{
    const allDone=w.days.every((_,di)=>data.sessions[sKey(w.week,di)]?.finished);
    return `<button class="chip ${i===data.week?'active':''} ${w.tag?'tag-'+w.tag:''}" onclick="selWeek(${i})">${allDone?'<span class="dot"></span>':''}W${w.week}${w.tag?`<small>${w.tag}</small>`:''}</button>`}).join('');
  document.getElementById('days').innerHTML=week.days.map((d,i)=>{
    const fin=data.sessions[sKey(week.week,i)]?.finished;
    return `<button class="chip daychip ${i===data.day?'active':''}" onclick="selDay(${i})">${fin?'<span class="dot"></span>':''}${esc(d.label)}<small>${esc(d.title)}${fin?' · fatto':''}</small></button>`}).join('');
  document.getElementById('dayTitle').textContent=day.title;

  document.getElementById('workout').innerHTML=day.exercises.length
    ?day.exercises.map((e,ei)=>card(e,ei,s,ei===wuIndex(day))).join('')+
      `<button class="finish ${s.finished?'closed':''}" id="btnFinish">${s.finished?'✓ Allenamento concluso · rivedi riepilogo':'Termina allenamento'}</button>`
    :'<div class="empty">Settimana di scarico o test: nessun esercizio programmato in questo giorno.</div>';
  bind();stats();syncDur();
}
function card(e,ei,s,withWu){
  const prev=lastSession(e.name)?.last,prog=progression(e);
  const def=e.weight??prog?.suggest??prev?.weight??'';
  let doneN=0;for(let i=0;i<e.sets;i++)if(s.done[ei+'_'+i])doneN++;
  const tags=[`<span class="tag">${e.sets} × ${esc(e.reps)}</span>`];
  if(e.weight!=null)tags.push(isBarbell(e)?`<button class="tag load" onclick="openPlates(${e.weight})">${fmtKg(e.weight)} kg</button>`:`<span class="tag load">${fmtKg(e.weight)} kg</span>`);
  if(e.ss)tags.push(`<span class="tag ss">superset ${e.ss.pos?'B':'A'} · con ${esc(e.ss.with)}</span>`);
  if(e.test)tags.push('<span class="tag test">TEST MASSIMALE</span>');
  if(prog)tags.push(`<span class="tag up">↑ +${fmtKg(prog.suggest-prog.from)} kg</span>`);
  tags.push(`<span class="tag">${e.ss&&!e.ss.pos?'rec dopo B':'rec '+e.rest+'s'}</span>`);
  tags.push(`<span class="tag">${esc(e.src)}</span>`);
  const be=bestE1(e.name);
  let hint;
  if(prog)hint=`<div class="hint up">↑ Range saturato l'ultima volta (${prog.top} rip su tutte le serie a ${fmtKg(prog.from)} kg): carico proposto ${fmtKg(prog.suggest)} kg</div>`;
  else if(e.weight!=null)hint=`<div class="hint">↗ Programmato ${fmtKg(e.weight)} kg${prev?` · ultima volta ${fmtKg(prev.weight)} kg × ${esc(prev.reps)}${prev.rpe?' @'+prev.rpe:''}`:''}${be?` · e1RM best ${Math.round(be)} kg`:''}</div>`;
  else hint=`<div class="hint">${prev?`↗ Ultima volta ${fmtKg(prev.weight)} kg × ${esc(prev.reps)}${prev.rpe?' @RPE '+prev.rpe:''}`:'↗ Nessuno storico: inserisci il carico'}</div>`;
  /* confronto RPE: settimana precedente (suggerimento) e settimana corrente (live) */
  if(e.src==='fondamentale'){
    const wk=cur(),pw=data.program.weeks[data.week-1];
    const now=rpeCheck(e.name,wk.week),prv=pw&&!wk.tag?rpeCheck(e.name,pw.week):null;
    if(prv?.over&&e.weight>prv.kg)hint+=`<div class="hint warn">⚠ W${pw.week}: RPE medio ${fmtKg(prv.avg)} sopra il target ${fmtKg(prv.target)}. Valuta di restare a ${fmtKg(prv.kg)} kg invece di ${fmtKg(e.weight)} kg. È solo un suggerimento: la scheda non cambia.</div>`;
    if(now?.over)hint+=`<div class="hint warn">⚠ Oggi RPE medio ${fmtKg(now.avg)} sopra il target ${fmtKg(now.target)} del blocco: la prossima settimana valuta di mantenere ${fmtKg(now.kg)} kg.</div>`;
  }
  return `<article class="exercise ${doneN===e.sets?'complete':''} ${e.ss?'ss':''}">
    <div class="exhead"><div><h3>${esc(e.name)}</h3><div class="presc">${tags.join('')}</div></div>
    <div class="exdone">${doneN}/${e.sets}</div></div>
    ${e.note?`<button class="notebtn" onclick="this.nextElementSibling.classList.toggle('hidden')">▾ Nota tecnica</button><div class="note hidden">${esc(e.note)}</div>`:''}
    ${withWu?wuBlock(e,s):''}
    <div class="sets">
      <div class="sethead"><span>#</span><span>KG</span><span>RIP</span><span>RPE</span><span>✓</span></div>
      ${Array.from({length:e.sets},(_,si)=>{const id=ei+'_'+si;return `<div class="setrow">
      <div class="setno">${si+1}</div>
      <div class="field"><input inputmode="decimal" data-k="w" data-i="${id}" data-e="${ei}" value="${esc(s.w[id]??def)}">${isBarbell(e)?`<button class="plate" data-plate="${id}" title="Calcolo dischi">⊜</button>`:''}</div>
      <div class="field"><input inputmode="numeric" data-k="r" data-i="${id}" value="${esc(s.r[id]??(/^\d+$/.test(String(e.reps).trim())?e.reps:''))}" placeholder="${esc(e.reps)}"></div>
      <div class="field"><input inputmode="decimal" data-k="p" data-i="${id}" value="${esc(s.p[id]??'')}" placeholder="—"></div>
      <input class="done" type="checkbox" data-i="${id}" data-e="${ei}" ${s.done[id]?'checked':''} aria-label="Serie ${si+1}">
    </div>`}).join('')}</div>
    ${hint}</article>`;
}
function bind(){
  const day=cur().days[data.day];
  document.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{
    const s=session(),k=i.dataset.k,id=i.dataset.i;
    if(k==='w'){
      const v=num(i.value)??0;s.w[id]=v;
      /* propaga il carico alle serie successive non ancora completate */
      const [ei,si]=id.split('_').map(Number),ex=day.exercises[ei];
      for(let j=si+1;j<ex.sets;j++){const jid=ei+'_'+j;if(!s.done[jid])s.w[jid]=v}
      save();render();return;
    }
    i.classList.remove('need');
    if(k==='p'){const v=num(i.value);s.p[id]=v==null?'':Math.min(10,Math.max(1,v))}
    else s.r[id]=i.value;
    save();stats();
  });
  document.querySelectorAll('[data-plate]').forEach(b=>b.onclick=e=>{
    e.preventDefault();const inp=b.parentElement.querySelector('input');openPlates(num(inp.value)??0)});
  document.querySelectorAll('.done:not(.wudone)').forEach(c=>c.onchange=()=>toggleSet(c,day));
  document.querySelectorAll('.wudone').forEach(c=>c.onchange=()=>toggleWu(c,day));
  const f=document.getElementById('btnFinish');if(f)f.onclick=finishWorkout;
}
function toggleSet(c,day){
  unlockAudio();
  const s=session(),id=c.dataset.i,ei=+c.dataset.e,ex=day.exercises[ei],row=c.closest('.setrow');
  const sid=sKey()+'_'+id,h=data.history[norm(ex.name)]??=[];
  data.names[norm(ex.name)]=ex.name;
  if(c.checked){
    const ri=row.querySelector('[data-k=r]');
    if(!/\d/.test(ri.value)){c.checked=false;ri.classList.add('need');ri.focus();toast('Inserisci le ripetizioni fatte prima di spuntare la serie');return}
  }
  s.done[id]=c.checked;
  if(c.checked){
    if(!s.since&&!s.elapsed){s.since=Date.now();markStart(s);requestWake()}
    const w=num(row.querySelector('[data-k=w]').value)??0,r=row.querySelector('[data-k=r]').value;
    const pv=num(row.querySelector('[data-k=p]').value);
    s.w[id]=w;s.r[id]=r;s.p[id]=pv??'';
    const before=bestE1(ex.name),now=e1rm(w,r);
    h.push({sid,date:today(),week:cur().week,weight:w,reps:r,rpe:pv,planned:ex.weight??null});
    if(h.length>400)h.shift();
    if(before>0&&now>before+0.01)toast(`🏆 Nuovo PR stimato su ${ex.name}: e1RM ${Math.round(now)} kg`,'pr');
    const [,si]=id.split('_').map(Number);
    if(ex.ss&&!ex.ss.pos&&day.exercises[ei+1]?.ss?.id===ex.ss.id){
      toast(`Superset: ora ${ex.ss.with}, serie ${si+1}`); /* niente recupero tra A e B */
    }else{
      const isB=ex.ss&&ex.ss.pos===1&&day.exercises[ei-1]?.ss?.id===ex.ss.id;
      const nextLbl=isB?(si+1<ex.sets?`Prossima: ${ex.ss.with} serie ${si+2}`:(day.exercises[ei+1]?`Prossimo: ${day.exercises[ei+1].name}`:'Ultima serie del giorno'))
        :si+1<ex.sets?`Prossima: serie ${si+2} · ${fmtKg(s.w[ei+'_'+(si+1)]??w)} kg`
        :(day.exercises[ei+1]?`Prossimo: ${day.exercises[ei+1].name}`:'Ultima serie del giorno');
      startTimer(ex.rest,isB?ex.ss.with+' + '+ex.name:ex.name,nextLbl);
    }
  }else{
    for(let j=h.length-1;j>=0;j--)if(h[j].sid===sid&&h[j].date===today()){h.splice(j,1);break}
  }
  save();render();
}
function dayStats(){
  const day=cur().days[data.day],s=session();
  let tot=0,done=0,vol=0;
  day.exercises.forEach((e,ei)=>{tot+=e.sets;for(let si=0;si<e.sets;si++){const id=ei+'_'+si;
    if(s.done[id]){done++;vol+=(s.w[id]??e.weight??0)*firstRep(s.r[id]??e.reps)}}});
  return{tot,done,vol};
}

/* ---------- fine allenamento ---------- */
function finishWorkout(){
  const s=session(),week=cur(),day=week.days[data.day];
  if(s.finished){showSummary(data.log.find(l=>l.key===sKey()&&l.date===s.finishedDate)||data.log.filter(l=>l.key===sKey()).pop());return}
  const st=dayStats();
  if(!st.done){toast('Completa almeno una serie prima di terminare');return}
  if(st.done<st.tot&&!confirm(`Hai completato ${st.done} serie su ${st.tot}. Terminare comunque?`))return;
  if(s.since){s.elapsed+=(Date.now()-s.since)/1000;s.since=null}
  s.endedAt=Date.now();if(!s.startedAt)s.startedAt=s.endedAt-Math.round(s.elapsed)*1000;
  releaseWake();
  const prs=day.exercises.filter((e,ei)=>{
    const today_=hist(e.name).filter(h=>h.date===today()&&h.sid?.startsWith(sKey()+'_'));
    const older=hist(e.name).filter(h=>!(h.date===today()&&h.sid?.startsWith(sKey()+'_')));
    const b0=older.reduce((m,h)=>Math.max(m,e1rm(h.weight,h.reps)),0);
    const b1=today_.reduce((m,h)=>Math.max(m,e1rm(h.weight,h.reps)),0);
    return b0>0&&b1>b0+0.01;}).map(e=>e.name);
  const entry={key:sKey(),date:today(),week:week.week,label:day.label,title:day.title,rpeWarn:day.exercises.filter(e=>e.src==='fondamentale').map(e=>({name:e.name,...(rpeCheck(e.name,week.week)||{})})).filter(x=>x.over),dur:Math.round(s.elapsed),start:s.startedAt,end:s.endedAt,vol:Math.round(st.vol),done:st.done,tot:st.tot,prs};
  data.log.push(entry);
  s.finished=true;s.finishedDate=today();
  if(data.settings.autoNext){
    if(data.day+1<week.days.length)data.day++;
    else if(data.week+1<data.program.weeks.length){data.week++;data.day=0}
  }
  save();render();showSummary(entry);
}
function showSummary(l){

   ${l.start||l.end?`<div class="clock show" style="margin:0 0 4px"><span>Inizio <b>${fmtTime(l.start)}</b></span><i>→</i><span>Fine <b>${fmtTime(l.end)}</b></span>${idx>=0?`<button onclick="editTimes(${idx})">Modifica</button>`:''}</div>`:''}

/* ---------- durata manuale + wake lock ---------- */
function durSec(){const s=session();return s.elapsed+(s.since?(Date.now()-s.since)/1000:0)}
function paintDur(){document.getElementById('dur').textContent=fmtDur(durSec())}
function syncDur(){const s=session(),run=!!s.since;
  document.getElementById('durAction').textContent=run?'Pausa durata':(s.elapsed?'Riprendi':'Avvia durata');
  document.getElementById('mDuration').classList.toggle('run',run);
  clearInterval(durId);paintDur();if(run)durId=setInterval(paintDur,1000);paintClock()}
function paintClock(){
  const el=document.getElementById('clock');if(!data.program){el.classList.remove('show');return}
  const s=session();el.classList.toggle('show',!!s.startedAt);

}

function editTimes(logIdx){

  document.getElementById('saveTimes').onclick=()=>{

    else{s.startedAt=a;s.endedAt=b;const e=data.log.filter(x=>x.key===sKey()).pop();if(e&&s.finished){e.start=a;e.end=b}}

document.getElementById('mDuration').onclick=()=>{if(!data.program)return;unlockAudio();const s=session();
  if(s.since){s.elapsed+=(Date.now()-s.since)/1000;s.since=null;releaseWake()}else{s.since=Date.now();markStart(s);if(!s.finished)s.endedAt=null;requestWake()}
  save();syncDur()};
async function requestWake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch{}}

/* ---------- audio ---------- */
function unlockAudio(){if(!data.settings.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function beep(freq=880,dur=.12,delay=0){
  if(!data.settings.sound||!audio)return;
  const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.02);
}

/* ---------- timer recupero ----------
   - il conto si basa sull'orario di fine (endAt), salvato in localStorage:
     sopravvive a schermo bloccato, cambio app e chiusura/riapertura
   - un tocco fuori dalla card NON chiude il timer
   - "Riduci" lo trasforma in una pillola sempre visibile
   - traccia audio in background: silenzio + bip finale, così il segnale
     arriva anche con l'app in background o lo schermo bloccato */
function persistTimer(name,next){data.timer=endAt?{endAt,total,name,next,min:minimized}:null;save()}
function startTimer(sec,name,next){
  clearInterval(timerId);total=Math.max(5,sec|0);endAt=Date.now()+total*1000;lastBeep=-1;
  document.getElementById('timerWho').textContent=name;
  document.getElementById('pillWho').textContent=name;
  document.getElementById('timerNext').textContent=next||'';
  setMin(minimized);persistTimer(name,next);
  startBgAudio();mediaSession(name);
  tick();timerId=setInterval(tick,250);
}
function setMin(m){
  minimized=m;
  document.getElementById('timerWrap').classList.toggle('show',!!endAt&&!m);
  document.getElementById('pill').classList.toggle('show',!!endAt&&m);
  if(data.timer){data.timer.min=m;save()}
}
function tick(){
  if(!endAt)return;
  const ms=endAt-Date.now(),left=Math.ceil(ms/1000),txt=left<=0?'VIA':fmtDur(left);
  const c=document.getElementById('count'),pc=document.getElementById('pillCount');
  c.textContent=pc.textContent=txt;
  c.classList.toggle('go',left<=0);pc.classList.toggle('go',left<=0);
  document.getElementById('bar').style.width=(total?Math.max(0,ms/(total*1000)*100):0)+'%';
  const bgPlaying=bgEl&&!bgEl.paused;
  if(left<=3&&left>0&&left!==lastBeep){lastBeep=left;if(!bgPlaying)beep(660,.08)}
  if(left<=0){
    clearInterval(timerId);
    const late=ms<-4000; /* finito mentre l'app era sospesa */
    if(!bgPlaying&&!late){beep(988,.18);beep(988,.18,.25);beep(1318,.3,.5)}
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
    if(late)toast('Recupero terminato mentre eri fuori dall\'app');
    endAt=0;persistTimer();
    setTimeout(()=>{if(!endAt)closeTimer()},late?600:2200);
  }
}
function closeTimer(){
  clearInterval(timerId);endAt=0;persistTimer();stopBgAudio();
  document.getElementById('timerWrap').classList.remove('show');
  document.getElementById('pill').classList.remove('show');
}
function adjust(sec){if(!endAt)return;endAt+=sec*1000;if(sec>0)total+=sec;if(endAt<=Date.now())endAt=Date.now()+500;
  lastBeep=-1;persistTimer(data.timer?.name,data.timer?.next);startBgAudio();tick()}
document.getElementById('btnSkip').onclick=closeTimer;

document.getElementById('btnPlus').onclick=()=>adjust(30);

document.getElementById('btnMinus').onclick=()=>adjust(-15);

/* traccia WAV generata al volo: silenzio per il tempo residuo, 3 bip brevi, bip finale */
function makeWav(seconds){
  const sr=8000,n=Math.ceil((seconds+1.2)*sr),buf=new ArrayBuffer(44+n),v=new DataView(buf);
  const str=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  str(0,'RIFF');v.setUint32(4,36+n,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);
  v.setUint16(32,1,true);v.setUint16(34,8,true);str(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);
  const tone=(at,dur,f)=>{const s0=Math.floor(at*sr),len=Math.floor(dur*sr);
    for(let i=0;i<len&&s0+i<n;i++){if(s0+i<0)continue;const env=Math.min(1,i/80,(len-i)/80);
      v.setUint8(44+s0+i,128+Math.round(90*env*Math.sin(2*Math.PI*f*i/sr)))}};
  for(let k=3;k>=1;k--)if(seconds-k>0)tone(seconds-k,.08,660);
  tone(seconds,.18,988);tone(seconds+.25,.18,988);tone(seconds+.5,.4,1318);
  return new Blob([buf],{type:'audio/wav'});
}
function startBgAudio(){
  if(!data.settings.sound||!data.settings.bgAudio||!endAt)return;
  try{
    stopBgAudio(true);
    const remain=Math.max(.5,(endAt-Date.now())/1000);
    bgUrl=URL.createObjectURL(makeWav(remain));
    bgEl??=new Audio();bgEl.setAttribute('playsinline','');bgEl.preload='auto';
    bgEl.src=bgUrl;bgEl.currentTime=0;
    const p=bgEl.play();if(p&&p.catch)p.catch(()=>{});
  }catch{}
}
function stopBgAudio(keepEl){try{if(bgEl){bgEl.pause();bgEl.removeAttribute('src');bgEl.load()}}catch{}
  if(bgUrl){URL.revokeObjectURL(bgUrl);bgUrl=null}}
function mediaSession(name){try{if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:'Recupero · '+name,artist:'Forge Tracker'});
  navigator.mediaSession.setActionHandler('pause',()=>{});}}catch{}}

/* ripristino dopo chiusura/riapertura dell'app */
function restoreTimer(){
  const t=data.timer;if(!t||!t.endAt)return;
  if(t.endAt<=Date.now()-60000){data.timer=null;save();return}
  endAt=t.endAt;total=t.total||60;minimized=!!t.min;
  document.getElementById('timerWho').textContent=t.name||'Recupero';
  document.getElementById('pillWho').textContent=t.name||'Recupero';
  document.getElementById('timerNext').textContent=t.next||'';
  setMin(minimized);tick();if(endAt)timerId=setInterval(tick,250);
}

  const best=Math.max(0,...pts.map(p=>p.e1)),maxW=Math.max(0,...pts.map(p=>p.max));
  show(`<h2>${esc(data.names[k]||k)}</h2><p class="lead">${pts.length} sedute · ${v.length} serie</p>
   <div class="kpis"><div><b>${fmtKg(maxW)}</b><span>kg max</span></div><div><b>${best?Math.round(best):'—'}</b><span>e1RM best</span></div><div><b>${fmtKg(pts.at(-1)?.max||0)}</b><span>kg ultima</span></div></div>
   ${pts.length>1?`<div class="chart">${chart(pts)}<div class="legend"><span><i style="background:var(--accent)"></i>carico max</span><span><i style="background:var(--blue)"></i>e1RM</span></div></div>`:'<p class="lead">Il grafico compare dalla seconda seduta.</p>'}
   ${[...pts].reverse().map(p=>`<div class="histitem"><b>${p.date} · W${p.week}</b><div>${p.sets.map(h=>`${fmtKg(h.weight)}×${esc(h.reps)}${h.rpe?'@'+h.rpe:''}`).join(' · ')}</div>${p.sets[0].planned!=null?`<div>Programmato ${fmtKg(p.sets[0].planned)} kg</div>`:''}</div>`).join('')}
   <button class="secondary" onclick="openHistory('esercizi')">‹ Indietro</button>`);
};
/* ---------- programmato vs reale sui fondamentali ---------- */
function liftNames(){const p=data.program;if(!p)return[];const out=[];
  p.weeks.forEach(w=>w.days.forEach(d=>d.exercises.forEach(e=>{if(e.src==='fondamentale'&&!out.includes(e.name))out.push(e.name)})));return out}
function liftRows(name){
  return data.program.weeks.map(w=>{
    let ex=null;w.days.forEach(d=>d.exercises.forEach(e=>{if(!ex&&e.name===name&&(e.src==='fondamentale'||e.src==='test'))ex=e}));
    const hs=hist(name).filter(h=>h.week===w.week);
    const top=hs.length?Math.max(...hs.map(h=>h.weight||0)):null;
    const e1=hs.length?Math.max(...hs.map(h=>e1rm(h.weight,h.reps)))||null:null;
    const rp=hs.filter(h=>h.rpe!=null&&h.rpe!=='');
    return{week:w.week,tag:w.tag,plan:ex?.weight??null,planReps:ex?.reps,e1plan:ex?.weight?e1rm(ex.weight,ex.reps)||null:null,
      top,e1,rpe:rp.length?Math.round(rp.reduce((a,h)=>a+ +h.rpe,0)/rp.length*10)/10:null,target:rpeTarget(w.week)};
  });
}
window.fondSel=n=>{data._fond=n;openHistory('fond')};
function fondView(){
  const names=liftNames();if(!names.length)return'<div class="empty">Importa la scheda per vedere il confronto.</div>';
  const n=names.includes(data._fond)?data._fond:names[0],rows=liftRows(n);
  const chips=`<div class="strip">${names.map(x=>`<button class="chip ${x===n?'active':''}" onclick="fondSel('${esc(x).replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')}</div>`;
  const done=rows.filter(r=>r.top!=null);
  const noTgt=!data.program.rpeTargets?.length?'<p class="lead">Target RPE non disponibili: reimporta il file Excel per leggerli dal foglio Panoramica.</p>':'';
  const tbl=`<table class="ftab"><tr><th>SETT.</th><th>PROGR.</th><th>REALE</th><th>Δ KG</th><th>e1RM</th><th>RPE / TGT</th></tr>${rows.map(r=>{
    const d=r.top!=null&&r.plan!=null?r.top-r.plan:null;
    return `<tr><td>W${r.week}${r.tag?' <span class="mut">'+r.tag+'</span>':''}</td><td>${r.plan!=null?fmtKg(r.plan):'<span class="mut">—</span>'}</td>
      <td>${r.top!=null?fmtKg(r.top):'<span class="mut">—</span>'}</td>
      <td class="${d==null?'mut':d>=0?'pos':'neg'}">${d==null?'—':(d>0?'+':'')+fmtKg(d)}</td>
      <td>${r.e1?Math.round(r.e1):'<span class="mut">—</span>'}</td>
      <td class="${r.rpe!=null&&r.target!=null&&r.rpe>r.target?'neg':''}">${r.rpe!=null?fmtKg(r.rpe):'—'}${r.target!=null?' / '+fmtKg(r.target):''}</td></tr>`}).join('')}</table>`;
  return chips+noTgt+(done.length?`<div class="chart">${weekChart(rows)}<div class="legend"><span><i style="background:#8f99ad"></i>programmato</span><span><i style="background:var(--accent)"></i>reale</span><span><i style="background:var(--blue)"></i>e1RM</span></div></div>`
    :'<p class="lead">Il grafico compare dopo la prima seduta registrata su questa alzata.</p>')+tbl;
}
function weekChart(rows){
  const W=330,H=160,pl=34,pr=10,pt=12,pb=22,N=rows.length;
  const ys=rows.flatMap(r=>[r.plan,r.top,r.e1]).filter(v=>v>0);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<10){hi+=5;lo-=5}
  const x=i=>pl+(N===1?0:i*(W-pl-pr)/(N-1)),y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const line=(k,col,extra='')=>{const ps=rows.map((r,i)=>r[k]>0?[x(i),y(r[k])]:null);let d='',open=false;
    ps.forEach(q=>{if(q){d+=(open?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);open=true}else open=false});
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" ${extra}/>`+ps.filter(Boolean).map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.8" fill="${col}"/>`).join('')};
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#262d3d"/><text x="${pl-5}" y="${y(v)+3}" fill="#8f99ad" font-size="9" text-anchor="end">${Math.round(v)}</text>`).join('');
  const lbl=rows.map((r,i)=>`<text x="${x(i)}" y="${H-6}" fill="${r.tag?'#ffc45e':'#8f99ad'}" font-size="8.5" text-anchor="middle">W${r.week}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${line('plan','#8f99ad','stroke-dasharray="5 4"')}${line('e1','#66d9ff','stroke-dasharray="2 3"')}${line('top','#9dff57')}${lbl}</svg>`;
}
function chart(pts){
  const W=330,H=150,pl=34,pr=10,pt=12,pb=24;
  const ys=pts.flatMap(p=>[p.max,p.e1].filter(Boolean));
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<5){hi+=2.5;lo-=2.5}
  const x=i=>pl+(pts.length===1?0:i*(W-pl-pr)/(pts.length-1)),y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const line=(key,col,dash='')=>{const ps=pts.map((p,i)=>p[key]?[x(i),y(p[key])]:null).filter(Boolean);
    return `<polyline fill="none" stroke="${col}" stroke-width="2.5" ${dash} points="${ps.map(q=>q.join(',')).join(' ')}"/>`+ps.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${col}"/>`).join('')};
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#262d3d"/><text x="${pl-5}" y="${y(v)+3}" fill="#8f99ad" font-size="9" text-anchor="end">${Math.round(v)}</text>`).join('');
  const lbl=[0,pts.length-1].map(i=>`<text x="${x(i)}" y="${H-6}" fill="#8f99ad" font-size="9" text-anchor="${i?'end':'start'}">${pts[i].date.slice(5).split('-').reverse().join('/')}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${line('e1','#66d9ff','stroke-dasharray="4 3"')}${line('max','#9dff57')}${lbl}</svg>`;
}

/* ---------- azioni globali ---------- */
document.getElementById('btnReset').onclick=()=>{
  if(!data.program)return;
  if(confirm('Azzerare serie, carichi e durata di questo giorno? Lo storico già registrato oggi per questo giorno verrà rimosso.')){
    const pre=sKey()+'_';
    for(const k in data.history)data.history[k]=data.history[k].filter(h=>!(h.date===today()&&h.sid?.startsWith(pre)));
    delete data.sessions[sKey()];releaseWake();save();render()}};

document.addEventListener('click',e=>{
  const id=e.target.id;
  if(id==='saveSet'){const st=data.settings;
    st.defaultRest=Math.max(10,num(document.getElementById('sRest').value)||90);
    st.bar=Math.max(0,num(document.getElementById('sBar').value)??20);
    st.plates=document.getElementById('sPlates').value||DEFAULTS.settings.plates;
    st.accStep=Math.max(0.5,num(document.getElementById('sStep').value)||2.5);
    st.sound=document.getElementById('sSound').checked;st.bgAudio=document.getElementById('sBg').checked;st.autoNext=document.getElementById('sNext').checked;
    st.wu=document.getElementById('sWu').checked;st.wuRamp=document.getElementById('sWuRamp').value;st.wuBase=document.getElementById('sWuBase').value;
    st.wuStep=Math.max(0.5,num(document.getElementById('sWuStep').value)||5);st.wuRest=Math.max(10,num(document.getElementById('sWuRest').value)||60);
    data.maxes??={};document.querySelectorAll('[data-max]').forEach(i=>{const v=num(i.value);if(v>0)data.maxes[i.dataset.max]=v;else delete data.maxes[i.dataset.max]});
    save();hide();render();toast('Impostazioni salvate')}
  if(id==='exp'||id==='bkNow'){data.lastBackup=Date.now();save();download(JSON.stringify(data,null,2),'forge-backup-'+today()+'.json','application/json');paintBanners()}
  if(id==='tipX'){data.hideInstallTip=true;save();paintBanners()}
  if(id==='expCsv'){
    const rows=[['Data','Settimana','Esercizio','Kg','Ripetizioni','RPE','Kg programmati','e1RM']];
    for(const k in data.history)data.history[k].forEach(h=>rows.push([h.date,h.week,data.names[k]||k,h.weight,h.reps,h.rpe??'',h.planned??'',e1rm(h.weight,h.reps)?Math.round(e1rm(h.weight,h.reps)*10)/10:'']));
    rows.sort((a,b)=>a===rows[0]?-1:b===rows[0]?1:String(a[0]).localeCompare(String(b[0])));
    download('\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace('.',',').replace(/"/g,'""')}"`).join(';')).join('\n'),'forge-storico-'+today()+'.csv','text/csv')}
  if(id==='wipe'&&confirm('Eliminare scheda, sessioni e storico? Esporta prima un backup.')){localStorage.removeItem(KEY);location.reload()}
});
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('change',async e=>{
  if(e.target.id==='fileIn'&&e.target.files?.[0]){importFile(e.target.files[0]);e.target.value=''}
  if(e.target.id==='bkIn'&&e.target.files?.[0]){
    try{const d=JSON.parse(await e.target.files[0].text());if(!d||typeof d!=='object'||!('history' in d))throw 0;
      if(!confirm('Sostituire i dati attuali con il backup?'))return;
      localStorage.setItem(KEY,JSON.stringify(d));data=load();hide();render();toast('Backup ripristinato')}
    catch{alert('File di backup non valido.')}
    e.target.value=''}
});

/* ---------- import ---------- */
/* legge le coppie "1RM Panca | 100 kg" dal foglio Panoramica (se c'e') e le
   associa al primo esercizio con carico che contiene quella parola.
   Non sovrascrive massimali gia' inseriti a mano. */
function importMaxes(rows,program){
  if(!rows)return;data.maxes??={};
  const lifts=[];program.weeks.forEach(w=>w.days.forEach(d=>{const e=d.exercises.find(x=>x.weight>0||x.test);if(e&&!lifts.includes(e.name))lifts.push(e.name)}));
  rows.forEach(r=>r.forEach((c,i)=>{
    const m=norm(c).match(/^1rm\s+(.+)$/);if(!m)return;
    const v=num(r[i+1]);if(!v)return;
    const target=lifts.find(n=>norm(n).includes(m[1])&&!/fermo|volume|stretta/.test(norm(n)));
    if(target&&!data.maxes[norm(target)])data.maxes[norm(target)]=v;
  }));
}
async function importFile(file){
  try{
    if(!window.XLSX)throw new Error('Libreria di lettura Excel non caricata: serve la connessione a Internet al primo import.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const sheets={};
    wb.SheetNames.forEach(n=>{sheets[norm(n)]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})});
    const missing=['foglio scheda','tabelle dei carichi','varianti con fermo','accessori'].filter(n=>!sheets[n]);
    if(missing.length)throw new Error('Fogli mancanti: '+missing.join(', '));
    const program=buildProgram(sheets);
    importMaxes(sheets['panoramica'],program);
    const keep=data.program&&confirm('Mantenere i progressi delle sessioni già svolte? (Annulla = ripartire da W1)');
    data.program=program;
    if(!keep){data.week=0;data.day=0;data.sessions={}}
    save();hide();render();
    toast(program.weeks.length+' settimane · '+program.dayLabels.length+' giorni importati');
  }catch(err){alert(err.message||'File non leggibile.')}
}

/* ---------- protezione dati ---------- */
const isStandalone=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function paintBanners(){
  const el=document.getElementById('banners');if(!el)return;let h='';
  const hasData=Object.values(data.history).some(v=>v.length);
  const days=data.lastBackup?Math.floor((Date.now()-data.lastBackup)/864e5):null;
  if(hasData&&(days==null||days>=7))h+=`<div class="banner"><span><b>Backup ${days==null?'mai fatto':'di '+days+' giorni fa'}.</b> I dati sono solo su questo telefono: esportane una copia.</span><button id="bkNow">Esporta</button></div>`;
  if(isIOS&&!isStandalone()&&!data.hideInstallTip)h+=`<div class="banner"><span><b>Non installata.</b> Da Safari, Safari può cancellare i dati dopo 7 giorni senza utilizzo. Condividi → <b>Aggiungi alla schermata Home</b> e apri da lì.</span><button class="x" id="tipX">✕</button></div>`;
  el.innerHTML=h;
}
async function protectStorage(){
  try{if(navigator.storage?.persist&&!(await navigator.storage.persisted()))data._persist=await navigator.storage.persist();else data._persist=await navigator.storage?.persisted?.()}catch{}
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
    navigator.serviceWorker.register('sw.js').catch(()=>{});
}
if(data.program&&data.program.v!==8){splitProgram(data.program);save()} /* migrazione v7 -> v8 */
protectStorage();
render();
restoreTimer();
if(data.program&&session().since)requestWake();
